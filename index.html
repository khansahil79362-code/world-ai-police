<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD AI POLICE V3 - By BADY</title>
<meta name="description" content="World AI Police V3 - Real AI by BADY Beed. English typing, Hindi voice.">
<meta name="author" content="BADY - Beed">
<style>
body{background:#0a0a0a;color:white;font-family:sans-serif;text-align:center;padding:15px;margin:0}
.card{background:#1a1a1a;padding:20px;border-radius:20px;max-width:500px;margin:15px auto;border:1px solid #333}
.input-row{display:flex}
input{width:80%;padding:15px;border-radius:30px 0 0 30px;border:none;font-size:16px;outline:none}
.mic{width:20%;padding:15px;border-radius:0 30px 30px 0;border:none;background:#222;color:white;font-size:20px;cursor:pointer}
button.main{padding:12px 15px;border-radius:30px;border:none;background:#0a84ff;color:white;font-weight:bold;width:48%;margin:5px;cursor:pointer}
button.voice{padding:12px 15px;border-radius:30px;border:none;background:#34c759;color:white;font-weight:bold;width:48%;margin:5px;cursor:pointer}
.result{margin-top:15px;background:white;color:black;padding:15px;border-radius:15px;text-align:left;min-height:100px;white-space:pre-wrap}
.red{background:#ff3b30;color:white;padding:10px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:10px}
.green{background:#34c759;color:white;padding:10px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:10px}
</style>
</head>
<body>

<b>🛡️ WORLD AI POLICE V3</b><br>
<span style="color:#0a84ff;font-size:12px">ENGLISH TYPE + HINDI VOICE - FINAL</span>
<div style="margin:10px;color:#888;font-size:11px">Made by BADY from Beed</div>

<div class="card">
<div class="input-row">
<input id="q" placeholder="Type in English... ex: elon musk kaun hai">
<button class="mic" onclick="startVoice()">🎤</button>
</div>
<button class="main" onclick="chatAI()">ASK AI</button>
<button class="voice" onclick="speakLast()">🔊 SUNO</button>
<div id="ans" class="result">🎤 Mic dabao... English me bolo: "elon musk kaun hai"</div>
</div>

<script>
let lastAnswer="";
function startVoice(){
 let R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R){alert("Chrome use kar bady");return;}
 let r=new R(); 
 r.lang='en-IN'; // ENGLISH TYPING HOGA
 r.start();
 document.getElementById('ans').innerHTML="🎤 Sun raha hu...";
 r.onresult=e=>{document.getElementById('q').value=e.results[0][0].transcript;chatAI();}
}
function speakLast(){
 if(!lastAnswer)return; speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(lastAnswer); 
 u.lang='hi-IN'; // BOLNA HINDI ME
 u.rate=0.9; 
 speechSynthesis.speak(u);
}
async function chatAI(){
 let q=document.getElementById('q').value.trim(), box=document.getElementById('ans');
 if(!q){box.innerHTML="Kuch likho bady!";return;}
 let l=q.toLowerCase();
 if(l.includes('live location')||l.includes('phone number')||l.includes('फोन')||l.includes('नंबर')||l.includes('मोबाइल')){
   lastAnswer="Privacy block. Phone number aur live location share nahi kar sakte."; 
   box.innerHTML=`<div class="red">🔴 RED SHIELD - BLOCKED</div>\n${lastAnswer}`; 
   speakLast(); return;
 }
 box.innerHTML="🤖 AI soch raha hai...";
 try{
  let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q+" answer in hindi short"));
  let t=await res.text(); lastAnswer=t;
  box.innerHTML=`<div class="green">🟢 GREEN SHIELD - VERIFIED 95%</div>\n${t}`; speakLast();
 }catch{box.innerHTML="Net slow, fir try kar bady";}
}
</script>
</body>
</html>
