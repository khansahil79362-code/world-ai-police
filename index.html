<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD AI POLICE V2 - REAL AI</title>
<style>
body{background:#0a0a0a;color:white;font-family:sans-serif;text-align:center;padding:20px;margin:0}
.card{background:#1a1a1a;padding:20px;border-radius:20px;max-width:500px;margin:15px auto;border:1px solid #333}
input{width:90%;padding:15px;border-radius:30px;border:none;font-size:16px;outline:none}
button.main{margin-top:15px;padding:12px 25px;border-radius:30px;border:none;background:#0a84ff;color:white;font-weight:bold;cursor:pointer;width:90%}
.result{margin-top:20px;background:white;color:black;padding:15px;border-radius:15px;text-align:left;min-height:80px;white-space:pre-wrap}
.shield{padding:10px;border-radius:10px;font-weight:bold;margin-bottom:10px;text-align:center}
.red{background:#ff3b30;color:white}
.green{background:#34c759;color:white}
.yellow{background:#ffcc00;color:black}
.stats{display:flex;justify-content:space-around;max-width:500px;margin:10px auto;font-size:12px;color:#888}
</style>
</head>
<body>
<b>🛡️ WORLD AI POLICE V2 - REAL AI CHAT</b>
<div class="stats"><span>🟢 Safe: <b id="safe">0</b></span><span>🔴 Blocked: <b id="blocked">0</b></span></div>
<p style="color:#888;font-size:13px">Real AI + Trust Score Engine</p>

<div class="card">
<input id="q" placeholder="AI se kuch bhi pucho... ex: 5 ka table, story likho">
<br>
<button class="main" onclick="chatAI()">ASK REAL AI - V2</button>
<div id="ans" class="result">Yaha AI ka jawab ayega...</div>
</div>

<script>
let s=0,b=0;
async function chatAI(){
 let q=document.getElementById('q').value.trim();
 let box=document.getElementById('ans');
 if(!q){box.innerHTML="Kuch likho bhai!";return;}
 let l=q.toLowerCase();

 if(l.includes('live location')||l.includes('phone number')||l.includes('ghar kaha')||l.includes('current location')){
   b++;document.getElementById('blocked').innerText=b;
   box.innerHTML=`🔴 RED SHIELD - BLOCKED (0%)\n\n🚨 PRIVACY BLOCK: Live location nahi de sakte.`;
   return;
 }
 if(l.includes('lottery')||l.includes('you won')||l.includes('kbc lottery')){
   b++;document.getElementById('blocked').innerText=b;
   box.innerHTML=`🔴 RED SHIELD - SCAM (0%)\n\n🚨 Ye Scam Hai! Block kiya.`;
   return;
 }

 box.innerHTML="🤖 AI soch raha hai... 2 sec ruko...";
 s++;document.getElementById('safe').innerText=s;

 try{
   // FREE AI API - NO KEY NEEDED
   let res = await fetch('https://text.pollinations.ai/' + encodeURIComponent(q));
   let text = await res.text();
   box.innerHTML=`🟢 GREEN SHIELD - AI VERIFIED (95%)\n\n🤖 AI Jawab:\n\n${text}\n\n---\n✅ Verified by World AI Police V2`;
 }catch(e){
   // Fallback if API fails
   if(l.includes('table')){
     let n=parseInt(q.match(/\d+/)?.[0]||5);
     let r=`${n} ka Table:\n`;
     for(let i=1;i<=10;i++) r+=`${n} x ${i} = ${n*i}\n`;
     box.innerHTML=`🟢 GREEN (100%)\n\n${r}`;
   } else {
     box.innerHTML=`🟢 GREEN (90%)\n\n🤖 ${q} ka jawab:\n\nMain abhi AI se connect nahi ho paya (net slow), par tumhara sawal safe hai! Dubara try karo.`;
   }
 }
}
</script>
</body>
</html>
