<script>
function scanLink(){
  let val = document.getElementById('linkInput').value.trim();
  let low = val.toLowerCase();
  let res = document.getElementById('result');
  res.style.display='block';
  if(!val){ res.innerHTML='⚠️ Pehle kuch likho...'; res.style.background='#333'; return; }

  // 1. FACT CHECK - Sahi / Galat sawal
  if(low.includes('prime minister') && low.includes('india')){
    res.innerHTML='✅ <b>FACT - SAHI JANKARI</b><br><br>India ke Prime Minister <b>Narendra Modi</b> hai (2026 tak).<br><br>Source: Beed AI Fact Node';
    res.style.background='#1b5e20'; return;
  }
  if(low.includes('elon musk') && low.includes('live location')){
    res.innerHTML='🚨 <b>GALAT HAI - FAKE HAI</b><br><br>Kisi ka bhi live location aise public nahi milta. Ye 100% scam/YouTube fake thumbnail trick hai.<br><br>Beed Node: FAKE';
    res.style.background='#b71c1c'; return;
  }

  // 2. SCAM CHECK
  const high = ['free recharge','lottery','you won','prize','bit.ly','kyc blocked','bank block','earn 5000'];
  const medium = ['offer','free followers','loan'];

  if(high.some(w => low.includes(w)) || (low.includes('http') && low.length>35)){
    res.innerHTML='🚨 <b>GALAT / SCAM HAI</b><br>Ye link/message scam ho sakta hai. Click mat karo.';
    res.style.background='#b71c1c';
  } else if(medium.some(w => low.includes(w))){
    res.innerHTML='⚠️ <b>SHAK HAI</b><br>Verify karo official site pe.';
    res.style.background='#e65100';
  } else {
    res.innerHTML='✅ <b>SAFE / SAHI HAI</b><br>Isme koi scam ya galat baat nahi mili. Ye normal text hai.';
    res.style.background='#1b5e20';
  }
}
</script>
