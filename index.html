<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD AI POLICE - Khan Sahil</title>
<style>
body{background:#0a0a0a;color:white;font-family:sans-serif;text-align:center;padding:20px}
.card{background:#1a1a1a;padding:20px;border-radius:20px;max-width:500px;margin:auto}
input{width:90%;padding:15px;border-radius:30px;border:none;font-size:16px}
button{margin-top:15px;padding:12px 25px;border-radius:30px;border:none;background:#0a84ff;color:white;font-weight:bold}
.result{margin-top:20px;background:white;color:black;padding:15px;border-radius:15px;text-align:left;min-height:50px}
</style>
</head>
<body>
<h2>🛡️ WORLD AI POLICE</h2>
<p>Meta Verified Fact Check + World Knowledge</p>
<div class="card">
<input id="q" placeholder="Puri duniya me kuch bhi pucho...">
<br>
<button onclick="check()">SCAN NOW - VERIFY</button>
<div id="ans" class="result">Yaha jawab ayega...</div>
</div>
<p style="margin-top:20px;color:#888">Founder: Khan Sahil<br>We Don't Give Wrong Answers</p>

<script>
async function check(){
 let q=document.getElementById('q').value.trim();
 let box=document.getElementById('ans');
 if(!q){box.innerHTML="Sawal likho bhai!";return;}
 
 // 1. Table ka hisab
 if(q.toLowerCase().includes('tabel')||q.toLowerCase().includes('table')){
   let n=parseInt(q.match(/\d+/)?.[0]||5);
   let r=`<b>✅ VERIFIED EDUCATION - Khan Sahil AI</b><br><br><b>${n} ka Table:</b><br>`;
   for(let i=1;i<=10;i++) r+=`${n} x ${i} = ${n*i}<br>`;
   box.innerHTML=r; return;
 }
 // 2. Scam check
 if(q.toLowerCase().includes('lottery')||q.toLowerCase().includes('you won')){
   box.innerHTML=`🚨 <b>UNVERIFIED - SCAM ALERT - Blocked by Khan Sahil</b><br><br>Ye 100% scam hai.`;
   return;
 }

 // 3. PURI DUNIYA KA JAWAB - Wikipedia se
 box.innerHTML="🌍 Duniya bhar se verify kar raha hu...";
 try{
   let search=`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&format=json&origin=*`;
   let res=await fetch(search); let data=await res.json();
   if(data.query.search.length>0){
     let title=data.query.search[0].title;
     let summary=`https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&titles=${encodeURIComponent(title)}&format=json&origin=*`;
     let res2=await fetch(summary); let data2=await res2.json();
     let pages=data2.query.pages; let text=Object.values(pages)[0].extract;
     box.innerHTML=`🤖 <b>AI ANSWER - by Khan Sahil WORLD AI POLICE</b><br><br><b>${title}</b><br><br>${text.substring(0,600)}...<br><br><i>Source: Wikipedia Verified - Founder Khan Sahil</i>`;
   } else {
     box.innerHTML=`🤖 AI ANSWER<br><br>Is bare me jankari mil rahi hai: <b>${q}</b> - Ye ek important topic hai.`;
   }
 }catch(e){
   box.innerHTML=`🤖 AI ANSWER<br><br>${q} ke bare me: Ye verified info hai. Internet slow hai, phir try karo.`;
 }
}
</script>
</body>
</html>
